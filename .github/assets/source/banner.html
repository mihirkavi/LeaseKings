<!doctype html>
<html><head><meta charset="utf-8">
<!-- LeaseKings README banner. Cardinal and gold sampled from "Lease Kings Logo.webp" (#672529, #bd8b38) on sandstone cream.
     DM Serif Display echoes the logo's chunky serif; DM Sans keeps body text friendly. Motif: a street map with listing pins
     and walking rings around campus (illustrative, not real listings). -->
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=block" rel="stylesheet">
<style>
:root{--bg:#f8f1e4;--ink:#2a1215;--muted:#6b5552;--cardinal:#8c1d2c;--gold:#bd8b38;--map:#fffaf1;--street:#eadfcc;--block:#f1e6d3;--park:#dfe6cc;--ring:rgba(140,29,44,.35)}
@media (prefers-color-scheme:dark){:root{--bg:#24100f;--ink:#fbf1df;--muted:#d4bfb4;--cardinal:#e0576a;--gold:#e0b25a;--map:#341816;--street:#4d2522;--block:#3e1d1b;--park:#3a3a24;--ring:rgba(224,178,90,.45)}}
*{margin:0;box-sizing:border-box}
body{width:1600px;height:600px;overflow:hidden;background:var(--bg);font-family:"DM Sans",sans-serif;color:var(--ink);position:relative}
.left{position:absolute;left:100px;top:86px;width:760px}
.brand{display:flex;align-items:center;gap:16px;font:400 32px "DM Serif Display";letter-spacing:.3px}
.brand img{width:58px;height:58px;border-radius:14px}
.eyebrow{margin-top:34px;display:flex;align-items:center;gap:14px;font:700 15px "DM Sans";letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.eyebrow i{display:inline-block;width:40px;height:2px;background:var(--gold)}
h1{margin-top:16px;font:400 84px/1.0 "DM Serif Display";letter-spacing:-1px}
h1 em{color:var(--cardinal)}
p{margin-top:24px;font:400 23px/1.45 "DM Sans";color:var(--muted);width:640px}
.map{position:absolute;right:80px;top:60px;width:600px;height:480px;border-radius:28px;overflow:hidden;background:var(--map);box-shadow:0 20px 50px rgba(60,20,20,.16);border:1px solid var(--street)}
</style></head><body>
<div class="left">
 <div class="brand"><img src="../../../Lease%20Kings%20Logo.webp" alt="">LeaseKings</div>
 <div class="eyebrow"><i></i>Student housing · concept</div>
 <h1>Find your place<br><em>near campus.</em></h1>
 <p>Rentals compared on price, safety, tenant reviews and the walk to class, in one search.</p>
</div>
<svg class="map" viewBox="0 0 600 480">
 <!-- street grid -->
 <g fill="var(--block)">
  <rect x="20" y="20" width="120" height="90" rx="8"/><rect x="160" y="20" width="120" height="90" rx="8"/><rect x="300" y="20" width="130" height="90" rx="8"/><rect x="450" y="20" width="130" height="90" rx="8"/>
  <rect x="20" y="130" width="120" height="100" rx="8"/><rect x="450" y="130" width="130" height="100" rx="8"/>
  <rect x="20" y="250" width="120" height="100" rx="8"/><rect x="450" y="250" width="130" height="100" rx="8"/>
  <rect x="20" y="370" width="120" height="90" rx="8"/><rect x="160" y="370" width="120" height="90" rx="8"/><rect x="300" y="370" width="130" height="90" rx="8"/><rect x="450" y="370" width="130" height="90" rx="8"/>
 </g>
 <!-- campus -->
 <rect x="160" y="130" width="270" height="220" rx="12" fill="var(--park)"/>
 <g fill="none" stroke="var(--ring)" stroke-width="2" stroke-dasharray="6 7">
  <circle cx="295" cy="240" r="150"/><circle cx="295" cy="240" r="230"/>
 </g>
 <text x="295" y="232" text-anchor="middle" font-family="DM Serif Display" font-size="26" fill="var(--ink)" opacity=".8">Campus</text>
 <text x="295" y="258" text-anchor="middle" font-family="DM Sans" font-size="13" letter-spacing="2" fill="var(--muted)">WALKING DISTANCE</text>
 <!-- pins -->
 <g>
  <g transform="translate(80 70)"><path d="M0 -34 a16 16 0 0 1 16 16 c0 12 -16 28 -16 28 s-16 -16 -16 -28 a16 16 0 0 1 16 -16z" fill="var(--cardinal)"/><circle cy="-18" r="6" fill="var(--map)"/></g>
  <g transform="translate(365 70)"><path d="M0 -34 a16 16 0 0 1 16 16 c0 12 -16 28 -16 28 s-16 -16 -16 -28 a16 16 0 0 1 16 -16z" fill="var(--gold)"/><circle cy="-18" r="6" fill="var(--map)"/></g>
  <g transform="translate(515 190)"><path d="M0 -34 a16 16 0 0 1 16 16 c0 12 -16 28 -16 28 s-16 -16 -16 -28 a16 16 0 0 1 16 -16z" fill="var(--cardinal)"/><circle cy="-18" r="6" fill="var(--map)"/></g>
  <g transform="translate(80 310)"><path d="M0 -34 a16 16 0 0 1 16 16 c0 12 -16 28 -16 28 s-16 -16 -16 -28 a16 16 0 0 1 16 -16z" fill="var(--gold)"/><circle cy="-18" r="6" fill="var(--map)"/></g>
  <g transform="translate(220 420)"><path d="M0 -34 a16 16 0 0 1 16 16 c0 12 -16 28 -16 28 s-16 -16 -16 -28 a16 16 0 0 1 16 -16z" fill="var(--cardinal)"/><circle cy="-18" r="6" fill="var(--map)"/></g>
  <g transform="translate(515 420)"><path d="M0 -34 a16 16 0 0 1 16 16 c0 12 -16 28 -16 28 s-16 -16 -16 -28 a16 16 0 0 1 16 -16z" fill="var(--gold)"/><circle cy="-18" r="6" fill="var(--map)"/></g>
 </g>
 <!-- a listing card -->
 <g transform="translate(330 300)">
  <rect width="200" height="58" rx="12" fill="var(--map)" stroke="var(--street)"/>
  <text x="16" y="25" font-family="DM Sans" font-weight="700" font-size="15" fill="var(--ink)">Price · safety · reviews</text>
  <text x="16" y="45" font-family="DM Sans" font-size="13" fill="var(--muted)">compared side by side</text>
 </g>
 <!-- crown -->
 <g transform="translate(295 175)" fill="var(--gold)"><path d="M-18 8 L-14 -8 L-6 0 L0 -12 L6 0 L14 -8 L18 8Z"/></g>
</svg>
</body></html>
